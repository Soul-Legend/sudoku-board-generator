[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sudoku-board-generator"
version = "1.0.0"
description = "Generate unique Sudoku puzzles of any NxN size and export them as PDF"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "reportlab>=4.0",
    "numpy>=1.24",
    "questionary>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
sudoku = "sudoku.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
